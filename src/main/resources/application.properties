spring.application.name=backend

server.port=${PORT:8088}

# Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA & Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Spring AI Configuration
spring.ai.huggingface.chat.api-key=${HF_TOKEN:dummy_token_key}
spring.ai.openai.api-key=${OPENAI_API_KEY:${HF_TOKEN:dummy_token_key}}
spring.ai.openai.base-url=${HF_BASE_URL:https://api-inference.huggingface.co/v1}
spring.ai.openai.chat.options.model=${HF_MODEL:mistralai/Mistral-7B-Instruct-v0.2}
# CORS Configuration
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5500}

