spring.application.name=backend

server.port=${PORT:8088}

# Datasource Configuration
# On Render: Configure SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD in Render Environment settings.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/localconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# JWT Configuration
jwt.secret=${JWT_SECRET:localConnectDevelopmentSecretKey123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Spring AI & Hugging Face Configuration
spring.ai.huggingface.chat.api-key=${HF_TOKEN:demo_token_key}
spring.ai.openai.api-key=${HF_TOKEN:${OPENAI_API_KEY:demo_token_key}}
spring.ai.openai.base-url=${HF_BASE_URL:https://api-inference.huggingface.co/v1}
spring.ai.openai.chat.options.model=${HF_MODEL:mistralai/Mistral-7B-Instruct-v0.2}

