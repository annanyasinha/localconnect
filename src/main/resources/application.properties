spring.application.name=backend

# Datasource Configuration: Defaults to embedded H2 for seamless cloud deployment if SPRING_DATASOURCE_URL is not set.
# When SPRING_DATASOURCE_URL is set in Render Environment, it will connect to your remote MySQL database.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:localconnect;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}


spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8088}

# JWT Configuration
jwt.secret=${JWT_SECRET:thisIsALocalConnectSecretKeyForJwtTokenGeneration123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Spring AI & Hugging Face Configuration
spring.ai.huggingface.chat.api-key=${HF_TOKEN:demo_token_key}
spring.ai.openai.api-key=${HF_TOKEN:${OPENAI_API_KEY:demo_token_key}}
spring.ai.openai.base-url=${HF_BASE_URL:https://api-inference.huggingface.co/v1}
spring.ai.openai.chat.options.model=${HF_MODEL:mistralai/Mistral-7B-Instruct-v0.2}